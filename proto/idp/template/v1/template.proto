syntax = "proto3";

package idp.template.v1;

import "google/protobuf/struct.proto";

option go_package = "github.com/drewpayment/orbit/proto/gen/go/idp/template/v1;templatev1";

// TemplateService handles template instantiation operations
service TemplateService {
  // Start a new template instantiation workflow
  rpc StartInstantiation(StartInstantiationRequest) returns (StartInstantiationResponse);

  // Get current progress of an instantiation
  rpc GetInstantiationProgress(GetProgressRequest) returns (GetProgressResponse);

  // Cancel an in-progress instantiation
  rpc CancelInstantiation(CancelRequest) returns (CancelResponse);

  // List available GitHub organizations for a workspace
  rpc ListAvailableOrgs(ListAvailableOrgsRequest) returns (ListAvailableOrgsResponse);

  // Start a new v2 ScaffolderWorkflow run for a published template definition version
  rpc StartScaffolderRun(StartScaffolderRunRequest) returns (StartScaffolderRunResponse);

  // Get the current step-by-step progress of a scaffolder run
  rpc GetRunProgress(GetRunProgressRequest) returns (GetRunProgressResponse);

  // Cancel an in-progress scaffolder run
  rpc CancelRun(CancelRunRequest) returns (CancelRunResponse);

  // List the action registry descriptors known to the worker (for definition
  // validation and Phase 2 authoring UI autocomplete)
  rpc ListActions(ListActionsRequest) returns (ListActionsResponse);

  // Resolve an `approval:request` step's human-in-the-loop gate on a running
  // scaffolder workflow (Phase 4 Task C)
  rpc ResolveScaffolderApproval(ResolveScaffolderApprovalRequest) returns (ResolveScaffolderApprovalResponse);
}

message StartInstantiationRequest {
  string template_id = 1;
  string workspace_id = 2;
  string target_org = 3;
  string repository_name = 4;
  string description = 5;
  bool is_private = 6;
  map<string, string> variables = 7;
  string user_id = 8;
  // Template source info
  string source_repo_url = 9;        // Full URL of the template repository
  bool is_github_template = 10;      // True if repo is marked as GitHub template
  string source_repo_owner = 11;     // Owner/org of template repo (parsed from URL)
  string source_repo_name = 12;      // Name of template repo (parsed from URL)
  // GitHub installation for authentication
  string github_installation_id = 13;  // ID of the GitHub App installation to use
}

message StartInstantiationResponse {
  string workflow_id = 1;
}

message GetProgressRequest {
  string workflow_id = 1;
}

message GetProgressResponse {
  string workflow_id = 1;
  WorkflowStatus status = 2;
  string current_step = 3;
  int32 progress_percent = 4;
  string error_message = 5;
  string result_repo_url = 6;
  string result_repo_name = 7;
}

enum WorkflowStatus {
  WORKFLOW_STATUS_UNSPECIFIED = 0;
  WORKFLOW_STATUS_PENDING = 1;
  WORKFLOW_STATUS_RUNNING = 2;
  WORKFLOW_STATUS_COMPLETED = 3;
  WORKFLOW_STATUS_FAILED = 4;
  WORKFLOW_STATUS_CANCELLED = 5;
}

message CancelRequest {
  string workflow_id = 1;
}

message CancelResponse {
  bool success = 1;
}

message ListAvailableOrgsRequest {
  string workspace_id = 1;
}

message GitHubOrg {
  string name = 1;
  string avatar_url = 2;
  string installation_id = 3;
}

message ListAvailableOrgsResponse {
  repeated GitHubOrg orgs = 1;
}

// --- v2 ScaffolderWorkflow (see docs/plans/2026-09-09-template-authoring-phase-1-engine.md §8) ---

message StartScaffolderRunRequest {
  string run_id = 1;                       // ActionRuns doc id (pre-created by orbit-www)
  string definition_version_id = 2;        // template-definition-versions doc id
  string workspace_id = 3;
  string user_id = 4;
  // Resolved parameter values, keyed by JSON-Schema property name across all
  // parameter pages. google.protobuf.Struct carries nested/typed values
  // (objects, arrays, numbers, bools) — the v1 RPC's map<string,string> can't.
  google.protobuf.Struct parameters = 5;
  bool dry_run = 6;
}

message StartScaffolderRunResponse {
  string workflow_id = 1;
}

message GetRunProgressRequest {
  string workflow_id = 1;
}

message GetRunProgressResponse {
  string workflow_id = 1;
  WorkflowStatus status = 2;
  repeated StepProgress steps = 3;
  google.protobuf.Struct outputs = 4;  // spec.output resolved against the final context, once succeeded
  string error_message = 5;
}

message StepProgress {
  string id = 1;
  string name = 2;
  string status = 3;  // pending | running | succeeded | failed | skipped
  string error = 4;
}

message CancelRunRequest {
  string workflow_id = 1;
}

message CancelRunResponse {
  bool success = 1;
}

message ListActionsRequest {}

message ListActionsResponse {
  repeated ActionDescriptor actions = 1;
}

message ResolveScaffolderApprovalRequest {
  string workflow_id = 1;
  string approval_id = 2;   // matches the step's generated approval id, disambiguates multiple approval:request steps
  bool approved = 3;
  string approver_id = 4;
  string comment = 5;
  // The run's workspace. Not used by the server for authorization (the
  // server resolves the run's true workspace from the Temporal workflow
  // memo via authorizeScaffolderRun, the same as GetRunProgress/CancelRun) —
  // it exists so the orbit-www gRPC auth interceptor can read a workspace id
  // off this request message and mint a token carrying the matching `wid`
  // claim, the same way StartScaffolderRunRequest's workspace_id does.
  string workspace_id = 6;
}

message ResolveScaffolderApprovalResponse {
  bool success = 1;
}

message ActionDescriptor {
  string name = 1;               // e.g. "github:repo:create"
  string family = 2;              // e.g. "github", "fs", "catalog"
  string input_schema_json = 3;   // JSON Schema, serialized (embedded via go:embed on the worker side)
  string output_schema_json = 4;  // JSON Schema, serialized
  bool supports_plan = 5;         // whether the action implements dry-run Plan()
}
